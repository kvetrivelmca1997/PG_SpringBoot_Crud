# Workshop Jenkins: no setup wizard, no login. Lab PCs only, never a real server.
name: workshop-jenkins
services:
  jenkins:
    build: .
    user: root
    ports: ["8080:8080"]
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
