# Server (PORT can be set from the environment, default 9100)
server.port=${PORT:9100}

# PostgreSQL connection
# Every value can come from an environment variable (Docker, Jenkins),
# and falls back to the original local settings when it is not set.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:data}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf
spring.thymeleaf.enabled=true
spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html

# Actuator: health endpoint for Docker healthcheck and the Jenkins smoke test
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
